services:
  - type: web
    name: un-whatsapp-manager
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: un-whatsapp-manager-db
          property: connectionString
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: SESSION_HOURS
        value: "12"
      - key: BROADCAST_DELAY_MS
        value: "100"
      - key: OUTBOUND_API_KEY
        generateValue: true

databases:
  - name: un-whatsapp-manager-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "15"
    databaseName: un_whatsapp_manager
    user: un_whatsapp_manager
