<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UN WhatsApp Manager</title>
  <meta name="theme-color" content="#151923" />
  <link href="/design-system/tokens.css" rel="stylesheet" />
  <link href="/design-system/components.css" rel="stylesheet" />
  <link href="/css/app.css" rel="stylesheet" />
</head>
<body class="un-root">
  <div class="app">
    <header class="topbar">
      <a class="brand" href="/" aria-label="UN WhatsApp Manager, home">
        <span class="brand-mark">UN</span>
        <span><strong>WhatsApp Manager</strong><small>United Network</small></span>
      </a>
      <nav aria-label="Navigazione principale">
        <a href="/">Home</a>
        <a href="/whatsapp" class="active" data-permission="chat:read">Conversazioni</a>
        <a href="/whatsapp/broadcast" data-permission="broadcast:read">Broadcast</a>
        <a href="/whatsapp/bots" data-permission="admin">BOT</a>
        <a href="/whatsapp/settings" data-permission="admin">Impostazioni</a>
      </nav>
      <div class="user" id="userEmail"></div>
    </header>

    <main class="dash" id="dashboard">
      <aside class="col conversations-column">
        <div class="col-header conversation-list-header">
          <select id="botSelect" class="bot-select" aria-label="Seleziona BOT" disabled>
            <option>Caricamento BOT</option>
          </select>
          <span class="col-actions"><button class="ghost" id="notificationBtn" type="button">Attiva notifiche</button><button class="ghost" id="refreshBtn" type="button">Aggiorna</button></span>
        </div>
        <div class="conversation-filters">
          <label class="search-field" for="conversationSearch">
            <input id="conversationSearch" type="search" placeholder="Cerca nome, numero o messaggio" autocomplete="off" disabled />
          </label>
          <div class="filter-row">
            <select id="conversationStatus" aria-label="Filtra per stato" disabled>
              <option value="">Tutti gli stati</option>
              <option value="active">BOT</option>
              <option value="human">Operatore</option>
              <option value="closed">Chiuse</option>
            </select>
            <select id="conversationBroadcast" aria-label="Filtra per broadcast" disabled>
              <option value="">Tutti i broadcast</option>
            </select>
            <select id="conversationArchive" aria-label="Filtra per archivio" disabled>
              <option value="active">Chat attive</option>
              <option value="archived">Chat archiviate</option>
            </select>
          </div>
        </div>
        <div class="col-body" id="conversationsList"><div class="empty-list">Seleziona un BOT</div></div>
      </aside>

      <section class="chat" id="chat">
        <div class="chat-empty" id="chatEmpty"><span class="empty-icon">UN</span><h2>Seleziona una conversazione</h2></div>
        <div id="chatView" style="display:none;height:100%;flex-direction:column">
          <div class="chat-header">
            <div><h3 id="chatTitle"></h3><div class="chat-subtitle" id="chatSubtitle"></div></div>
            <div class="switch" id="modeSwitch"><button data-mode="bot">BOT</button><button data-mode="human">Operatore</button></div>
          </div>
          <div class="status-bar" id="statusBar">
            <div class="label"><span class="dot"></span><span id="statusText"></span></div>
            <div class="status-actions">
              <button class="ghost" id="unreadBtn">Segna come non letta</button>
              <button class="ghost" id="archiveBtn">Archivia</button>
              <button class="ghost" id="closeBtn">Chiudi</button>
              <button class="ghost danger-text" id="deleteConversationBtn" hidden>Elimina</button>
            </div>
          </div>
          <div class="chat-body" id="chatBody"></div>
          <div class="chat-input">
            <div class="composer-toolbar">
              <button class="composer-tool" id="attachBtn" type="button" title="Invia un’immagine, un documento, un audio o un video">
                <span><strong>Allega</strong><small>File o media</small></span>
              </button>
              <button class="composer-tool" id="addChatActionBtn" type="button" title="Aggiungi un link cliccabile o una risposta rapida">
                <span><strong>Azione</strong><small>Link o risposta</small></span>
              </button>
              <input id="chatMediaFile" type="file" hidden accept="image/*,video/mp4,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.vcf" />
            </div>
            <div class="attachment-preview" id="chatAttachmentPreview" hidden></div>
            <div class="action-editor chat-action-editor" id="chatActions" hidden></div>
            <div class="row"><textarea id="msgInput" placeholder="Scrivi come operatore..."></textarea><button id="sendBtn">Invia</button></div>
            <div class="hint"><span id="inputHint">L’invio passa all’operatore</span><span>Invio per mandare. Maiusc + Invio per andare a capo.</span></div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
