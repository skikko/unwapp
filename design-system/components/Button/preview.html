<!doctype html>
<html lang="it" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>UN Platform - Button</title>
<link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css">
<style>body{margin:0;background:var(--surface-soft)}</style></head>
<body>
<!-- @dsCard group="Actions" height=150 -->
<div class="un-root" style="padding:24px">
<div style="display:grid;gap:16px">
<div class="un-btn-group">
  <button class="un-btn un-btn--primary"><svg class="un-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg>Nuovo contatto</button>
  <button class="un-btn un-btn--secondary"><svg class="un-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>Importa CSV</button>
  <button class="un-btn un-btn--ghost">Annulla</button>
  <button class="un-btn un-btn--danger">Elimina</button>
  <button class="un-btn un-btn--secondary un-btn--icon" aria-label="Altre azioni"><svg class="un-icon " viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button>
</div>
<div class="un-btn-group">
  <button class="un-btn un-btn--primary un-btn--sm">Salva</button>
  <button class="un-btn un-btn--secondary un-btn--sm"><svg class="un-icon " viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copia</button>
  <button class="un-btn un-btn--primary un-btn--lg">Crea il primo BOT</button>
  <button class="un-btn un-btn--primary" disabled>Invio in corso...</button>
</div></div>
</div>
</body></html>
