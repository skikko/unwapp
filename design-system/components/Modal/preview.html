<!doctype html>
<html lang="it" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>UN Platform - Modal</title>
<link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css">
<style>body{margin:0;background:var(--surface-soft)}</style></head>
<body>
<!-- @dsCard group="Overlays" height=360 -->
<div class="un-root" style="padding:24px">
<div style="position:relative;height:320px;border-radius:12px;overflow:hidden"><div class="un-overlay" style="position:absolute">
<div class="un-modal" role="dialog" aria-modal="true" aria-labelledby="mt">
  <header class="un-card__head"><h3 class="un-card__title" id="mt">Eliminare 2 contatti?</h3><button class="un-btn un-btn--ghost un-btn--icon un-btn--sm" aria-label="Chiudi"><svg class="un-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></header>
  <div class="un-card__body">I contatti verranno rimossi da tutte le liste e dalle sequenze attive. L'operazione non si puo' annullare.</div>
  <footer class="un-card__foot"><button class="un-btn un-btn--ghost">Annulla</button><button class="un-btn un-btn--danger">Elimina 2 contatti</button></footer>
</div></div></div>
</div>
</body></html>
