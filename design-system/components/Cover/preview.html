<!doctype html>
<html lang="it" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>UN Platform - Cover</title>
<link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css">
<style>body{margin:0;background:var(--surface-soft)}</style></head>
<body>
<!-- @dsCard height=300 -->
<div class="cv">
<svg class="cv-art" viewBox="0 0 960 300" width="960" height="300" aria-hidden="true">
<!--
blocks: navy (3x2 and two 2x1 tiles), accent (2x3 slab + one 1x1), accent-soft and line as relief tiles; navy and accent take the big fields because they are the brand.
arrangement: flush modular grid right of x=480, 72px cells on a space-2 (8px) gap, top row bleeding off the top edge.
pattern: tiles cut by radius-md, some merged two- and three-wide, chosen because the system is a dense data UI built from cards, tables and panes.
scales: cell 72px = 9 x space-2, gap space-2, corners radius-md (12px).
-->
<rect class="t navy" x="488" y="-20" width="232" height="152"/><rect class="t accent" x="728" y="-20" width="152" height="232"/><rect class="t soft" x="888" y="-20" width="72" height="72"/><rect class="t line" x="888" y="60" width="72" height="72"/><rect class="t soft" x="888" y="140" width="72" height="72"/><rect class="t soft" x="488" y="140" width="72" height="72"/><rect class="t line" x="568" y="140" width="72" height="72"/><rect class="t accent" x="648" y="140" width="72" height="72"/><rect class="t navy" x="488" y="220" width="152" height="72"/><rect class="t soft" x="648" y="220" width="72" height="72"/><rect class="t line" x="728" y="220" width="72" height="72"/><rect class="t navy" x="808" y="220" width="152" height="72"/>
</svg>
<div class="cv-text"><div class="cv-name">UN<br>Platform</div><div class="cv-tag">Back office di United Network: WhatsApp Manager, CRM, utenti.</div></div>
</div>
<style>
.cv{position:relative;width:960px;height:300px;background:var(--surface-soft);overflow:hidden;font-family:var(--font-sans)}
.cv-art{position:absolute;inset:0}
.t{rx:var(--radius-md)}
.navy{fill:var(--navy)} .accent{fill:var(--accent)} .soft{fill:var(--accent-soft)} .line{fill:var(--line)}
.cv-text{position:absolute;left:40px;bottom:32px;max-width:420px}
.cv-name{font-size:88px;line-height:.95;font-weight:800;letter-spacing:-.03em;color:var(--ink)}
.cv-tag{margin-top:16px;font-size:14px;line-height:20px;color:var(--ink-muted)}
</style>
</body></html>
